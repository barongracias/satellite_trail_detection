# Base config for M5.6 paper-faithful robust restudy.
# Fixed bundle: full-image normalisation, paper-faithful BCE+Dice, BF16/TF32,
# cosine LR, per-epoch geometric augmentation, and 1.0x signal-dependent noise.
# Optuna searches only lr / dropout / bce_weight / batch_size.
#
# Run with:
#   STUDY_NAME=unet_paper_noise_f1 CONFIG=configs/experiments/unet_paper_noise_base.yaml \
#     N_TRIALS=50 SKIP_RETRAIN=1 sbatch slurm/optuna_sweep.sbatch

experiment_name: unet_paper_noise_base
data_root: data/Processed
patch_dir: data/patches
patch_size: 512
stride: 512

batch_size: 16        # seed/default only; Optuna searches {8,16,32}
num_workers: 8
use_amp: true
amp_dtype: bfloat16
float32_matmul_precision: high
lr_scheduler: cosine

learning_rate: 1.0e-3 # seed/default only; Optuna searches conditionally by batch size
epochs: 50
base_channels: 8
dropout_rate: 0.5
normalisation: full_image
train_ratio: 0.70
val_ratio: 0.15
seed: 2804
threshold: 0.5
auto_pos_weight: false
pos_weight: null
augment_train: true
noise_augment: true
noise_std_multiplier: 1.0
noise_calibration_path: results/classical/background_noise_calibration.json
bce_weight: 0.5
dice_weight: 0.5
dice_smooth: 1.0e-4
dice_denominator_squared: true
device: auto
checkpoint_dir: results/checkpoints
log_dir: results/logs
skip_test_eval: false

sweep:
  objective: val_f1
  trial_epochs: 20
  retrain_epochs: 75
  timeout_seconds: 41400
  auto_retrain: false
  skip_test_eval: true
  skip_test_eval_retrain: true
  normalisation_search_space: []
  batch_size_search_space: [8, 16, 32]
  learning_rate_min: 1.0e-4
  learning_rate_max: 1.0e-3
  learning_rate_max_by_batch_size:
    8: 5.0e-4
    16: 1.0e-3
    32: 2.0e-3
