# Full U-Net baseline training run — paper-faithful settings.
# Run on CSD3 with: python -m src.training.train_unet --config configs/experiments/unet_baseline.yaml

experiment_name: unet_baseline
data_root: data/Processed
patch_dir: null          # set to data/patches after running scripts/build_patch_dataset.py
patch_size: 512
stride: 512
batch_size: 4
learning_rate: 1.0e-3
epochs: 50
base_channels: 8          # paper: filters 8 -> 128
dropout_rate: 0.5         # paper: dropout in bottleneck and decoder
train_ratio: 0.70
val_ratio: 0.15
seed: 2804
threshold: 0.5            # swept on val-set PR curve; this is the initial value
auto_pos_weight: true
bce_weight: 0.5
dice_weight: 0.5
num_workers: 4
device: auto
checkpoint_dir: results/checkpoints
log_dir: results/logs
