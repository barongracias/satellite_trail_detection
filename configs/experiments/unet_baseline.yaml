# Initial U-Net baseline training run (M4-era; fixed normalisation, base config).
# NOT the paper-architecture restudy config — that is the recovered .h5 architecture
# with full_image normalisation under configs/experiments/restudy_topk/ and
# unet_paper_arch_noise_*. Retained as the pre-restudy baseline comparison point.
# Run on CSD3 with: python -m src.training.train_unet --config configs/experiments/unet_baseline.yaml

experiment_name: unet_baseline
data_root: data/Processed
patch_dir: data/patches
batch_size: 4
learning_rate: 1.0e-3
epochs: 50
base_channels: 8          # paper: filters 8 -> 128
normalisation: fixed      # fixed=(mean=0.5,std=0.5) | per_image=(x-μ)/σ per patch | full_image=(x-μ)/σ from manifest per-image stats
seed: 2804
threshold: 0.5            # swept on val-set PR curve; this is the initial value
augment_train: true       # per-epoch dihedral aug on train split
bce_weight: 0.5
dice_weight: 0.5
dice_smooth: 1.0e-4         # paper-faithful (asta/ASTA.py:121-139)
dice_denominator_squared: true
num_workers: 4
device: auto
checkpoint_dir: results/checkpoints
log_dir: results/logs
