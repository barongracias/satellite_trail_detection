# Canary for the paper-faithful re-Optuna regime.
# Validates BF16/TF32, batch_size=16, per_image normalisation, and the previous
# Optuna-scale learning rate over the same 20-epoch budget used per trial.

experiment_name: unet_reoptuna_canary
data_root: data/Processed
patch_dir: data/patches
patch_size: 512
stride: 512

batch_size: 16
num_workers: 8
use_amp: true
amp_dtype: bfloat16
float32_matmul_precision: high
lr_scheduler: cosine

learning_rate: 1.59e-4
epochs: 20
base_channels: 8
dropout_rate: 0.5
normalisation: per_image
train_ratio: 0.70
val_ratio: 0.15
seed: 2804
threshold: 0.5
auto_pos_weight: false
pos_weight: null
augment_train: true
bce_weight: 0.5
dice_weight: 0.5
dice_smooth: 1.0e-4
dice_denominator_squared: true
device: auto
checkpoint_dir: results/checkpoints
log_dir: results/logs
