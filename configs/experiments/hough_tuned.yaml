# Tuned Hough-transform baseline — best config from grid search.
# Grid searched: hough_threshold in [50,100,200], min_line_length in [500,1000,2000,5000]
# on 20-image subset. Best F1=0.0008 at threshold=50, min_line_length=1000.
# Precision is fundamentally capped (~0.0004) by astronomical image structure
# (stellar/galaxy edges generate pervasive false Hough lines).

data_root: data/Processed
metrics_path: results/classical/hough_tuned_metrics.csv
summary_path: results/classical/hough_tuned_summary.json
log_dir: results/logs

# Canny edge detection
canny_low_threshold: 50
canny_high_threshold: 150

# Probabilistic Hough line detection — tuned values
hough_threshold: 50       # 50 vs baseline 50 (same — higher values cut recall to 0)
min_line_length: 1000     # 1000 vs baseline 40 (key change for 10560px images)
max_line_gap: 10
line_thickness: 3

# Intensity normalisation
clip_low_percentile: 1.0
clip_high_percentile: 99.5
